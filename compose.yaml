services:
  app:
    image: analytics-api:v1
    build: 
      context: .
      dockerfile: Dockerfile.web
    environment:
      - PORT=8002
    env_file:
      - .env
    ports:
      - "8002:8002"
    working_dir: /code
    # Using uv run is safer as it automatically handles internal pathways
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8002 --reload
    volumes:
      - ./src:/code:rw
      - /code/.venv        # Safeguards your python packages from being overwritten
    develop:
      watch:
        - action: rebuild
          path: Dockerfile.web
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: uv.lock
        - action: rebuild 
          path: compose.yaml